name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths-ignore:
      - "**.md"
      - "renovate.json"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle
        run: ./gradlew build
      - name: Deploy
        env:
          ORG_GRADLE_PROJECT_repoUsername: ${{ secrets.NEWREPO_USERNAME }}
          ORG_GRADLE_PROJECT_repoPassword: ${{ secrets.NEWREPO_PASSWORD }}
        run: ./gradlew publish
